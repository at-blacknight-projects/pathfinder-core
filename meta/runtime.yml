---
# PathfinderCore devices are reached over TCP, never over an Ansible connection
# plugin, so every module in this collection runs on the controller. 2.14 is the
# floor purely for the argument-spec features used here.
requires_ansible: ">=2.14.0"

action_groups:
  pathfinder_core:
    - pfc_logs
    - pfc_advanced_options
    - pfc_users
    - pfc_access
    - pfc_devices
