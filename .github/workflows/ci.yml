---
name: CI

# Release channels come from ci-templates' default semantic-release config:
# main is the stable channel, and rc/uat/dev/alpha are prerelease channels.
on:
  push:
    branches: [main, rc, uat, dev, alpha]
  pull_request:

# Read-only by default. The two jobs that call ci-templates grant their own
# scopes below: a reusable workflow's token is capped at its caller's, so the
# template's permissions blocks can only narrow what the calling job gives.
permissions:
  contents: read

jobs:
  units:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The module_utils depend only on the standard library, so the planner,
      # the parser and the boundary guard are all testable with no Ansible and
      # no device. That is the point of the layering, and it keeps this job to
      # a few seconds.
      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -t tests/unit -v

  sanity:
    name: ansible-test sanity
    runs-on: ubuntu-latest
    steps:
      # ansible-test requires the collection to sit at a path ending
      # ansible_collections/<namespace>/<name>/, so check out into one.
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/at_blacknight/pathfinder_core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install 'ansible-core>=2.16,<2.17'

      # Catches what unit tests cannot: invalid DOCUMENTATION YAML (which makes
      # a module's docs unusable), argument_spec and documentation disagreeing,
      # CRLF line endings, and executable bits on modules.
      - name: Run sanity tests
        working-directory: ansible_collections/at_blacknight/pathfinder_core
        run: ansible-test sanity --local --python 3.12

  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      # Same layout reason as sanity: ansible-lint resolves the collection by
      # its path, and linting the integration playbook means resolving the FQCNs
      # it calls.
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/at_blacknight/pathfinder_core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned. ansible-lint adds rules between minor versions, so an unpinned
      # install turns someone else's release into a red build on an unrelated
      # commit.
      - name: Install ansible-lint
        run: pip install 'ansible-lint==26.8.0'

      # Complements sanity rather than repeating it: sanity checks the module
      # contract (documentation matching argument_spec, line endings, imports),
      # lint checks how the YAML is written - unnamed tasks, non-FQCN module
      # references, a requires_ansible claiming a version nobody tests.
      #
      # --offline because the runner has no business fetching galaxy metadata to
      # decide whether this repository is well formed.
      # ANSIBLE_COLLECTIONS_PATH points at the workspace so the FQCNs in the
      # integration playbook resolve to THIS checkout. Without it lint resolves
      # them against whatever happens to be installed - which on a developer's
      # machine is usually a previously-installed copy, so it passes locally and
      # fails here. It did exactly that.
      - name: Run ansible-lint
        working-directory: ansible_collections/at_blacknight/pathfinder_core
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: ansible-lint --offline

  build:
    name: Collection builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install 'ansible-core>=2.16,<2.17'

      # Proves galaxy.yml is valid and the artifact actually assembles, which
      # is what a consumer's `ansible-galaxy collection install` will do.
      - name: Build collection artifact
        run: ansible-galaxy collection build --force

  # ── Shared checks ──────────────────────────────────────────────────────────
  # PR title (conventional commits, which is what versions the release) and a
  # Trivy filesystem scan, from the shared ci-templates. Pinned to the v0 major
  # tag, which ci-templates moves to each compatible release.
  shared:
    name: Shared
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: at-blacknight-projects/ci-templates/.github/workflows/no-build-ci.yml@v0

  # ── Release ────────────────────────────────────────────────────────────────
  # In this file rather than a separate release workflow so it can wait on the
  # collection checks above: a caller cannot add `needs` to the jobs inside a
  # reusable workflow, so the gate has to be on the job that calls it.
  #
  # galaxy.yml carries a hardcoded `version:` that MUST equal the release tag.
  # Left unstamped, `ansible-galaxy collection install` resolves a tag whose
  # artifact then declares a different version. The bump stage rewrites it and
  # hands the changed file to the release commit; the pattern is a sed regex.
  release:
    name: Release
    needs: [units, sanity, lint, build, shared]
    if: github.event_name == 'push'
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: at-blacknight-projects/ci-templates/.github/workflows/no-build-release.yml@v0
    with:
      replacements: '[{"file": "galaxy.yml", "pattern": "^version:.*", "replacement": "version: {{version}}"}]'
    secrets:
      app-id: ${{ secrets.RELEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
