---
name: CI

# Release channels come from atb-ci's semantic-release config: main is the
# stable channel, and rc/uat/dev/alpha are prerelease channels.
on:
  push:
    branches: [main, rc, uat, dev, alpha]
  pull_request:

permissions:
  contents: write

jobs:
  units:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The module_utils depend only on the standard library, so the planner,
      # the parser and the boundary guard are all testable with no Ansible and
      # no device. That is the point of the layering, and it keeps this job to
      # a few seconds.
      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -t tests/unit -v

  sanity:
    name: ansible-test sanity
    runs-on: ubuntu-latest
    steps:
      # ansible-test requires the collection to sit at a path ending
      # ansible_collections/<namespace>/<name>/, so check out into one.
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/at_blacknight/pathfinder_core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install 'ansible-core>=2.16,<2.17'

      # Catches what unit tests cannot: invalid DOCUMENTATION YAML (which makes
      # a module's docs unusable), argument_spec and documentation disagreeing,
      # CRLF line endings, and executable bits on modules.
      - name: Run sanity tests
        working-directory: ansible_collections/at_blacknight/pathfinder_core
        run: ansible-test sanity --local --python 3.12

  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      # Same layout reason as sanity: ansible-lint resolves the collection by
      # its path, and linting the integration playbook means resolving the FQCNs
      # it calls.
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/at_blacknight/pathfinder_core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned. ansible-lint adds rules between minor versions, so an unpinned
      # install turns someone else's release into a red build on an unrelated
      # commit.
      - name: Install ansible-lint
        run: pip install 'ansible-lint==26.8.0'

      # Complements sanity rather than repeating it: sanity checks the module
      # contract (documentation matching argument_spec, line endings, imports),
      # lint checks how the YAML is written - unnamed tasks, non-FQCN module
      # references, a requires_ansible claiming a version nobody tests.
      #
      # --offline because the runner has no business fetching galaxy metadata to
      # decide whether this repository is well formed.
      - name: Run ansible-lint
        working-directory: ansible_collections/at_blacknight/pathfinder_core
        run: ansible-lint --offline

  build:
    name: Collection builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: pip install 'ansible-core>=2.16,<2.17'

      # Proves galaxy.yml is valid and the artifact actually assembles, which
      # is what a consumer's `ansible-galaxy collection install` will do.
      - name: Build collection artifact
        run: ansible-galaxy collection build --force

  # ── Release ────────────────────────────────────────────────────────────────
  # atb-ci's stages are composed directly rather than going through its
  # no-build-release wrapper. The wrapper forwards `replacement-files` (a JSON
  # array) into `git-commit-files`, which stage-release-semantic interpolates
  # as a bare string: the inner quotes are lost and the asset becomes the glob
  # `[galaxy.yml]`, a character class that matches no file. The replacement
  # then happens, uploads, restores, and is silently dropped from the release
  # commit. Passing `git-commit-files` a plain path here avoids that entirely.
  version:
    name: Detect version
    needs: [units, sanity, lint, build]
    if: github.event_name == 'push'
    uses: at-blacknight/atb-ci/.github/workflows/stage-version-detect.yml@v0.1.1
    with:
      upload-artifacts: false

  stamp-version:
    name: Stamp version into galaxy.yml
    needs: version
    if: needs.version.outputs.would-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # galaxy.yml carries a hardcoded `version:` that MUST equal the release
      # tag. Left unstamped, `ansible-galaxy collection install` resolves a tag
      # whose artifact then declares a different version.
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          sed -i -E "s|^version:.*|version: ${VERSION}|" galaxy.yml
          grep -E "^version:" galaxy.yml
          # Fail loudly rather than release a mismatched artifact.
          grep -qx "version: ${VERSION}" galaxy.yml

      # stage-release-semantic restores everything under ./artifacts to the
      # repository root before running semantic-release, so the layout here
      # must mirror the repo layout.
      - name: Upload stamped galaxy.yml
        uses: actions/upload-artifact@v4
        with:
          name: text-replace-galaxy
          path: galaxy.yml
          retention-days: 5

  release:
    name: Release
    needs: [version, stamp-version]
    if: needs.version.outputs.would-release == 'true'
    permissions:
      contents: write
    uses: at-blacknight/atb-ci/.github/workflows/stage-release-semantic.yml@v0.1.1
    with:
      download-artifacts: true
      artifact-pattern: 'text-replace-*'
      # A plain path, not a JSON array — this is what the stage expects, and
      # it lands in the @semantic-release/git assets alongside the changelog.
      git-commit-files: 'galaxy.yml'
