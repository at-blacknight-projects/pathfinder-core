---
namespace: at_blacknight
name: pathfinder_core
version: 0.1.0-alpha.13

readme: README.md
authors:
  - Adam Butler <github@at-blacknight.com>

description: >-
  Manage Telos/Axia PathfinderCore PRO broadcast router-control appliances.
  Reconciles the Logs subtree over the SapV2 API (TCP 9600) and the Advanced
  options boot script over the web admin, with read-back verification on every
  write and an explicit runtime/config boundary. Pre-1.0: logs and
  startup_script are the only modules that change anything, survey reports, and
  the users/access/devices modules are stubs that fail on invocation.

license_file: LICENSE

tags:
  - broadcast
  - telos
  - axia
  - pathfinder
  - sapv2
  - networking

dependencies: {}

repository: https://github.com/at-blacknight-projects/pathfinder-core
documentation: https://github.com/at-blacknight-projects/pathfinder-core/tree/main/docs
homepage: https://github.com/at-blacknight-projects/pathfinder-core
issues: https://github.com/at-blacknight-projects/pathfinder-core/issues

build_ignore:
  - .github
  - .gitignore
  - tests/output
  - "*.tar.gz"
